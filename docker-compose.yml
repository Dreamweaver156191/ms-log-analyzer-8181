version: '3.8'

services:
  logfile-analyzer:
    build: src/main/java/za/co/frei/logfile/analyzer
    ports:
      - "8181:8181"
    environment:
      - SPRING_PROFILES_ACTIVE=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8181/api/v1/logs/hello"]
      interval: 30s
      timeout: 3s
      retries: 3