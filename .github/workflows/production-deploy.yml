# CI/CD Pipeline for Production Branch
# Tests are run on every push/PR to ensure code quality
# Render.com handles deployment by building directly from this branch

name: Production CI

on:
  push:
    branches: [ production ]
  pull_request:
    branches: [ production ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn test

      - name: Build with Maven
        run: mvn clean package -DskipTests

  validate-docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (validation only)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: logfile-analyzer:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max